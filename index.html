<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Saldo Barbearia</title>

  <!-- PWA / iOS Config -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Barbearia">
  <meta name="theme-color" content="#F7F7F9">
  
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='110' fill='%231C1C1E'/%3E%3Ctext x='50%25' y='54%25' font-size='260' text-anchor='middle' dominant-baseline='middle'%3EB%3C/text%3E%3C/svg%3E">

  <!-- Bibliotecas do Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-primary: #F7F7F9;
      --bg-elevated: #FFFFFF;
      --primary: #1C1C1E;
      --success: #34C759;
      --danger: #FF3B30;
      --danger-bg: #FFF1F0;
      --text-primary: #1C1C1E;
      --text-secondary: #8E8E93;
      --text-muted: #AEAEB2;
      --border: rgba(0, 0, 0, 0.08);
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      padding: calc(env(safe-area-inset-top) + 20px) 20px 40px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Cards */
    .ios-card {
      background: var(--bg-elevated);
      border-radius: var(--radius-lg);
      padding: 22px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
      border: 0.5px solid var(--border);
    }

    /* Saldo Topo */
    .saldo-header {
      text-align: center;
      padding: 12px 0;
    }
    .saldo-header h2 {
      font-size: 0.8rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
    }
    .saldo-valor {
      font-size: 3rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-top: 4px;
      letter-spacing: -1px;
      transition: color 0.3s ease;
    }
    .saldo-negativo { color: var(--danger) !important; }

    /* Ações Rápidas */
    .card-header-flex {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .card-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .btn-whatsapp {
      background: transparent;
      border: 0.5px solid var(--border);
      color: var(--text-primary);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn-whatsapp:active { background: #F2F2F7; }

    .quick-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn-quick {
      background: var(--bg-elevated);
      color: var(--primary);
      border: 0.5px solid var(--border);
      padding: 16px;
      border-radius: var(--radius-md);
      font-size: 0.95rem;
      font-weight: 500;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.2s;
    }
    .btn-quick:active { transform: scale(0.98); background: #F2F2F7; }
    .btn-quick span:last-child { font-weight: 600; color: var(--text-secondary); }

    /* Lançamento Personalizado */
    .form-group {
      margin-bottom: 12px;
    }
    input {
      width: 100%;
      height: 48px;
      padding: 0 16px;
      font-size: 0.95rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: #F7F7F9;
      color: var(--text-primary);
      outline: none;
      -webkit-appearance: none;
      transition: border-color 0.2s, background-color 0.2s;
    }
    input::placeholder { color: var(--text-muted); }
    input:focus {
      border-color: var(--primary);
      background: #FFF;
    }
    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }
    .btn {
      flex: 1;
      height: 48px;
      border: none;
      border-radius: var(--radius-md);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }
    .btn-add { background: var(--primary); color: #FFF; }
    .btn-sub { background: #FFFFFF; color: var(--danger); border: 1px solid var(--border); }
    .btn:active { transform: scale(0.97); opacity: 0.8; }

    /* Histórico */
    .history-container {
      max-height: 420px;
      overflow-y: auto;
    }
    .month-group-title {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 16px 0 8px 0;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--border);
    }
    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 0.5px solid rgba(0,0,0,0.04);
    }
    .history-item:last-child { border-bottom: none; }
    .history-info { flex: 1; }
    .history-desc { font-weight: 500; font-size: 0.95rem; color: var(--text-primary); }
    .history-date { font-size: 0.75rem; color: var(--text-muted); margin-top: 3px; }
    
    .history-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .history-val { font-weight: 600; font-size: 0.95rem; }
    .val-pos { color: var(--success); }
    .val-neg { color: var(--text-primary); }
    
    .btn-delete {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1rem;
      padding: 6px;
      cursor: pointer;
      border-radius: var(--radius-sm);
    }
    .btn-delete:hover { color: var(--danger); background: var(--danger-bg); }

    /* Modal Customizado Premium */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
      display: flex; align-items: center; justify-content: center; z-index: 1000;
      opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    
    .modal-box {
      background: var(--bg-elevated); width: 300px;
      border-radius: var(--radius-lg); padding: 24px; text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.15);
      transform: scale(0.95); transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .modal-overlay.active .modal-box { transform: scale(1); }
    
    .modal-title { font-weight: 600; font-size: 1.1rem; margin-bottom: 8px; color: var(--text-primary); }
    .modal-desc { font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 24px; line-height: 1.4; }
    .modal-actions { display: flex; gap: 10px; }
    
    .modal-btn {
      flex: 1; padding: 14px; border: none; border-radius: var(--radius-md);
      font-weight: 600; font-size: 0.95rem; cursor: pointer;
    }
    .modal-btn-cancel { background: #F2F2F7; color: var(--primary); }
    .modal-btn-confirm { background: var(--primary); color: #FFF; }
    .modal-btn-danger { background: var(--danger); color: #FFF; }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- SALDO ATUAL -->
    <div class="ios-card saldo-header">
      <h2>Saldo Atual</h2>
      <div class="saldo-valor" id="saldoDisplay">R$ 0,00</div>
    </div>

    <!-- AÇÕES RÁPIDAS (Ordenadas por preço) -->
    <div class="ios-card">
      <span class="card-title" style="margin-bottom: 14px; display:block;">Ações Rápidas</span>
      <div class="quick-actions">
        <button class="btn-quick" onclick="lancarRapido('Barba', 25.00)">
          <span>Barba</span> <span>- R$ 25,00</span>
        </button>
        <button class="btn-quick" onclick="lancarRapido('Corte', 45.00)">
          <span>Corte</span> <span>- R$ 45,00</span>
        </button>
        <button class="btn-quick" onclick="lancarRapido('Corte + Barba', 70.00)">
          <span>Corte + Barba</span> <span>- R$ 70,00</span>
        </button>
      </div>
    </div>

    <!-- LANÇAMENTO PERSONALIZADO -->
    <div class="ios-card">
      <span class="card-title" style="margin-bottom: 14px; display:block;">Lançamento Personalizado</span>
      <div class="form-group">
        <input type="text" id="inputDesc" placeholder="Descrição">
      </div>
      <div class="form-group">
        <input type="number" id="inputValor" placeholder="Valor (R$)" step="0.01" inputmode="decimal">
      </div>
      <div class="btn-row">
        <button class="btn btn-add" onclick="lancarPersonalizado('soma')">Adicionar</button>
        <button class="btn btn-sub" onclick="lancarPersonalizado('subtracao')">Subtrair</button>
      </div>
    </div>

    <!-- HISTÓRICO -->
    <div class="ios-card">
      <div class="card-header-flex">
        <span class="card-title">Histórico Recente</span>
        <button class="btn-whatsapp" onclick="enviarRelatorioWhatsApp()">Enviar Mês</button>
      </div>
      <div class="history-container" id="listaHistorico">
        <p style="text-align:center; padding: 20px; color: var(--text-muted); font-size: 0.85rem;">Carregando...</p>
      </div>
    </div>

  </div>

  <!-- MODAL DE CONFIRMAÇÃO CUSTOMIZADO -->
  <div class="modal-overlay" id="customModal">
    <div class="modal-box">
      <div class="modal-title" id="modalTitle">Confirmação</div>
      <div class="modal-desc" id="modalDesc">Tem certeza que deseja continuar?</div>
      <div class="modal-actions">
        <button class="modal-btn modal-btn-cancel" onclick="closeModal()">Cancelar</button>
        <button class="modal-btn" id="modalConfirmBtn" onclick="executeModal()">Confirmar</button>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD7vdvBDk6k48AlRDQpdrhOxG212MovmrM",
      authDomain: "rocha-batista.firebaseapp.com",
      databaseURL: "https://rocha-batista-default-rtdb.firebaseio.com",
      projectId: "rocha-batista",
      storageBucket: "rocha-batista.firebasestorage.app",
      messagingSenderId: "737568409775",
      appId: "1:737568409775:web:41b6eefa0b18199886ac5a"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.database();

    const DEFAULT_EMAIL = "rochabatista@wilson.com";
    const DEFAULT_PASS = "wrzt01";

    let userId = null;
    let saldoAtual = 0;
    let dadosGlobaisHistorico = [];

    auth.signInWithEmailAndPassword(DEFAULT_EMAIL, DEFAULT_PASS).catch(err => console.error(err));

    auth.onAuthStateChanged(user => {
      if (user) {
        userId = user.uid;
        carregarDados();
      }
    });

    function carregarDados() {
      db.ref(`usuarios/${userId}/barbearia/saldo`).on('value', snapshot => {
        saldoAtual = snapshot.val() || 0;
        atualizarVisorSaldo(saldoAtual);
      });

      db.ref(`usuarios/${userId}/barbearia/historico`).orderByChild('timestamp').on('value', snapshot => {
        const container = document.getElementById('listaHistorico');
        container.innerHTML = '';
        
        if (!snapshot.exists()) {
          dadosGlobaisHistorico = [];
          container.innerHTML = '<p style="text-align:center; padding: 20px; color: var(--text-muted); font-size: 0.85rem;">Nenhuma movimentação.</p>';
          return;
        }

        const registros = [];
        snapshot.forEach(child => { registros.push({ id: child.key, ...child.val() }); });
        
        registros.sort((a, b) => b.timestamp - a.timestamp);
        dadosGlobaisHistorico = registros; // Salva para o relatório do WhatsApp

        // Agrupar por Mês/Ano
        const grupos = {};
        registros.forEach(item => {
          const d = new Date(item.timestamp);
          const mesAno = d.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
          const chaveMes = mesAno.charAt(0).toUpperCase() + mesAno.slice(1);
          if (!grupos[chaveMes]) grupos[chaveMes] = [];
          grupos[chaveMes].push(item);
        });

        let htmlFinal = '';
        for (const [mes, itens] of Object.entries(grupos)) {
          htmlFinal += `<div class="month-group-title">${mes}</div>`;
          itens.forEach(item => {
            const isPositivo = item.tipo === 'soma';
            const sinal = isPositivo ? '+' : '-';
            const classeCor = isPositivo ? 'val-pos' : 'val-neg';
            
            const dataObj = new Date(item.timestamp);
            const dataStr = dataObj.toLocaleDateString('pt-BR') + ' às ' + dataObj.toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});

            htmlFinal += `
              <div class="history-item">
                <div class="history-info">
                  <div class="history-desc">${item.descricao}</div>
                  <div class="history-date">${dataStr}</div>
                </div>
                <div class="history-right">
                  <div class="history-val ${classeCor}">
                    ${sinal} R$ ${item.valor.toFixed(2).replace('.', ',')}
                  </div>
                  <button class="btn-delete" onclick="tentarExcluir('${item.id}', '${item.descricao}', ${item.valor}, '${item.tipo}')">✕</button>
                </div>
              </div>
            `;
          });
        }
        container.innerHTML = htmlFinal;
      });
    }

    let confirmAction = null;
    function showModal(title, desc, confirmText, isDanger, action) {
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('modalDesc').innerText = desc;
      const confirmBtn = document.getElementById('modalConfirmBtn');
      confirmBtn.innerText = confirmText;
      confirmBtn.className = 'modal-btn ' + (isDanger ? 'modal-btn-danger' : 'modal-btn-confirm');
      
      confirmAction = action;
      document.getElementById('customModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('customModal').classList.remove('active');
      confirmAction = null;
    }

    function executeModal() {
      if (confirmAction) confirmAction();
      closeModal();
    }

    function lancarRapido(descricao, valor) {
      showModal('Confirmar Débito', `Lançar ${descricao} no valor de R$ ${valor.toFixed(2).replace('.', ',')}?`, 'Confirmar', false, () => {
        processarTransacao(descricao, valor, 'subtracao');
      });
    }

    function lancarPersonalizado(tipo) {
      const descInput = document.getElementById('inputDesc');
      const valInput = document.getElementById('inputValor');
      
      const descricao = descInput.value.trim() || (tipo === 'soma' ? 'Recarga' : 'Gasto Avulso');
      const valorStr = valInput.value.replace(',', '.');
      const valor = parseFloat(valorStr);

      if (isNaN(valor) || valor <= 0) {
        showModal('Erro', 'Por favor, digite um valor válido.', 'Entendi', false, null);
        return;
      }

      processarTransacao(descricao, valor, tipo);
      descInput.value = '';
      valInput.value = '';
    }

    function processarTransacao(descricao, valor, tipo) {
      if (!userId) return;
      const novoSaldo = tipo === 'soma' ? (saldoAtual + valor) : (saldoAtual - valor);
      const novaTransacao = { descricao, valor, tipo, timestamp: firebase.database.ServerValue.TIMESTAMP };
      const updates = {};
      const novaChaveHist = db.ref().child(`usuarios/${userId}/barbearia/historico`).push().key;
      
      updates[`usuarios/${userId}/barbearia/historico/${novaChaveHist}`] = novaTransacao;
      updates[`usuarios/${userId}/barbearia/saldo`] = novoSaldo;
      db.ref().update(updates);
    }

    function tentarExcluir(id, descricao, valor, tipo) {
      showModal('Excluir Registro', `Deseja apagar "${descricao}" e estornar o valor de R$ ${valor.toFixed(2).replace('.', ',')} no saldo?`, 'Excluir', true, () => {
        const ajuste = tipo === 'soma' ? -valor : valor;
        const novoSaldo = saldoAtual + ajuste;
        const updates = {};
        
        updates[`usuarios/${userId}/barbearia/historico/${id}`] = null;
        updates[`usuarios/${userId}/barbearia/saldo`] = novoSaldo;
        db.ref().update(updates);
      });
    }

    function enviarRelatorioWhatsApp() {
      if (dadosGlobaisHistorico.length === 0) {
        showModal('Aviso', 'Não há lançamentos para gerar o relatório.', 'Entendi', false, null);
        return;
      }

      // Pega o mês do lançamento mais recente
      const maisRecente = new Date(dadosGlobaisHistorico[0].timestamp);
      const mesNome = maisRecente.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
      const mesFormatado = mesNome.charAt(0).toUpperCase() + mesNome.slice(1);
      const mesAlvo = maisRecente.getMonth();
      const anoAlvo = maisRecente.getFullYear();

      const itensDoMes = dadosGlobaisHistorico.filter(item => {
        const d = new Date(item.timestamp);
        return d.getMonth() === mesAlvo && d.getFullYear() === anoAlvo;
      });

      let texto = `Relatório Barbearia - ${mesFormatado}\n\n`;
      texto += `Saldo Atual: R$ ${saldoAtual.toFixed(2).replace('.', ',')}\n\n`;
      texto += `Movimentações do Mês:\n`;

      itensDoMes.forEach(item => {
        const d = new Date(item.timestamp);
        const dataCurta = d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
        const sinal = item.tipo === 'soma' ? '+' : '-';
        // Espaços invisíveis ou formatação textual para evitar que o WhatsApp crie links de discagem com os números
        texto += `• ${dataCurta}: ${item.descricao} (${sinal} R$ ${item.valor.toFixed(2).replace('.', ',')})\n`;
      });

      const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(texto)}`;
      window.open(url, '_blank');
    }

    function atualizarVisorSaldo(valor) {
      const visor = document.getElementById('saldoDisplay');
      visor.innerText = `R$ ${valor.toFixed(2).replace('.', ',')}`;
      if (valor < 0) {
        visor.classList.add('saldo-negativo');
      } else {
        visor.classList.remove('saldo-negativo');
      }
    }
  </script>
</body>
</html>
